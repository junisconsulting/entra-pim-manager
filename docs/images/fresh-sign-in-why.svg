<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356">
  <title>Without an authentication context, the morning's sign-in is enough to activate a role hours later, for anyone at the unlocked PC; with an authentication context set to Every time, Windows asks again on each activation, with a Windows Hello passkey a glance, touch or PIN, and Entra checks and logs it</title>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 600; fill: #0F172A; }
    .s { font-size: 12.5px; fill: #64748B; }
    .step { font-size: 13px; fill: #334155; }
    .sub { font-size: 11.5px; fill: #64748B; }
    .n { font-size: 11.5px; font-weight: 600; text-anchor: middle; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="355" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Without an authentication context -->
  <rect x="24" y="24" width="440" height="308" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round">
    <circle cx="56" cy="54" r="11"/>
    <path d="M56 47 V54 L61 57"/>
  </g>
  <text x="80" y="60" class="h">Without an authentication context</text>
  <text x="80" y="79" class="s">what most tenants have today</text>
  <path d="M44 96 H444" stroke="#EEF2F7"/>

  <g class="n" fill="#475569">
    <circle cx="54" cy="119" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="123">1</text>
    <circle cx="54" cy="149" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="153">2</text>
    <circle cx="54" cy="179" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="183">3</text>
  </g>
  <text x="74" y="123" class="step">Sign in in the morning, approve MFA</text>
  <text x="74" y="153" class="step">Hours later: click Activate</text>
  <text x="74" y="183" class="step">The role is active — nothing asks again</text>
  <text x="44" y="219" class="sub">PIM's own "require MFA" is met by that morning MFA.</text>

  <rect x="40" y="262" width="408" height="54" rx="8" fill="#FEF2F2"/>
  <text x="56" y="284" font-size="12.5" font-weight="600" fill="#B91C1C">Anyone at your unlocked PC, or holding your</text>
  <text x="56" y="303" font-size="12.5" font-weight="600" fill="#B91C1C">tokens, gets the same click.</text>

  <!-- With an authentication context -->
  <rect x="496" y="24" width="440" height="308" rx="12" fill="#FFFFFF" stroke="#DDD6FE"/>
  <g fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="528" cy="50" r="6"/>
    <path d="M517 66 C517 59 522 57 528 57 C531 57 534 58 536 59"/>
    <path d="M533 64 L536.5 67.5 L543 60"/>
  </g>
  <text x="552" y="60" class="h">With an authentication context</text>
  <text x="552" y="79" class="s">sign-in frequency: Every time</text>
  <path d="M516 96 H916" stroke="#EEF2F7"/>

  <g class="n" fill="#FFFFFF">
    <circle cx="526" cy="119" r="10" fill="#7C3AED"/><text x="526" y="123">1</text>
    <circle cx="526" cy="149" r="10" fill="#7C3AED"/><text x="526" y="153">2</text>
    <circle cx="526" cy="197" r="10" fill="#7C3AED"/><text x="526" y="201">3</text>
  </g>
  <text x="546" y="123" class="step">Click Activate</text>
  <text x="546" y="153" class="step">Windows asks you to sign in again</text>
  <text x="546" y="171" class="sub">with a Windows Hello passkey: glance, touch or PIN</text>
  <text x="546" y="201" class="step">The role is active</text>
  <text x="516" y="237" class="sub">Further activations within 10 minutes do not ask again.</text>

  <rect x="512" y="262" width="408" height="54" rx="8" fill="#F0FDF4"/>
  <text x="528" y="293" font-size="12.5" font-weight="600" fill="#15803D">Entra checks the fresh sign-in, and logs it.</text>
</svg>
