<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <title>Rolling out to a team: an admin script creates the App Registration once per tenant, one Intune Win32 package serves every tenant, and each endpoint installs per user, already configured</title>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .top { font-size: 13px; font-weight: 600; fill: #64748B; }
    .h { font-size: 15px; font-weight: 600; fill: #0F172A; }
    .mono { font-size: 11px; fill: #6D28D9; font-family: "Cascadia Code", Consolas, Menlo, monospace; }
    .code { font-size: 11px; fill: #0F172A; font-family: "Cascadia Code", Consolas, Menlo, monospace; }
    .t { font-size: 12px; fill: #475569; }
    .ok { font-size: 12.5px; fill: #0F172A; }
    .res { font-size: 11.5px; fill: #64748B; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/>
    </marker>
    <path id="check" d="M-4 0 l2.8 3 l5.2 -6" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="24" y="34" class="top">Rolling out to a team</text>
  <text x="936" y="34" font-size="12.5" fill="#94A3B8" text-anchor="end">Nobody types a client id</text>

  <!-- 1: App Registration -->
  <rect x="24" y="52" width="288" height="284" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="68" width="30" height="24" rx="4"/>
    <path d="M46 76 l4 4 l-4 4 M54 84 h8"/>
  </g>
  <text x="82" y="80" class="h">Once per tenant</text>
  <text x="82" y="97" class="mono">create-app-registration.ps1</text>
  <text x="40" y="124" class="t">An admin runs it once and it sets up:</text>
  <rect x="36" y="136" width="264" height="132" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <use href="#check" transform="translate(54 159)"/><text x="66" y="163" class="ok">the App Registration</text>
  <use href="#check" transform="translate(54 189)"/><text x="66" y="193" class="ok">the WAM redirect URI</text>
  <use href="#check" transform="translate(54 219)"/><text x="66" y="223" class="ok">delegated permissions only</text>
  <use href="#check" transform="translate(54 249)"/><text x="66" y="253" class="ok">admin consent</text>
  <text x="40" y="294" class="res">Prints the install command</text>
  <text x="40" y="311" class="res">with the ids filled in</text>

  <path d="M314 194 H332" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2: Intune package -->
  <rect x="336" y="52" width="288" height="284" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round">
    <path d="M352 74 l14 -7 l14 7 v16 l-14 7 l-14 -7 z M352 74 l14 7 l14 -7 M366 81 v16"/>
  </g>
  <text x="394" y="80" class="h">One package, every tenant</text>
  <text x="394" y="97" class="mono">…-win-Setup.intunewin</text>
  <text x="352" y="124" class="t">Intune Win32 app, attached to each release:</text>
  <rect x="348" y="136" width="264" height="132" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="360" y="160" class="code">install-entra-pim-manager.ps1</text>
  <text x="372" y="180" class="code">-TenantId <tspan fill="#6D28D9">&lt;guid&gt;</tspan></text>
  <text x="372" y="200" class="code">-ClientId <tspan fill="#6D28D9">&lt;guid&gt;</tspan></text>
  <text x="372" y="220" class="code">-NoStart</text>
  <path d="M360 236.5 H600" stroke="#E2E8F0"/>
  <text x="360" y="256" class="code">Install behavior: <tspan font-weight="700">User</tspan></text>
  <text x="352" y="294" class="res">No ids inside the package —</text>
  <text x="352" y="311" class="res">they go into the install command</text>

  <path d="M626 194 H644" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3: Endpoint -->
  <rect x="648" y="52" width="288" height="284" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="664" y="68" width="30" height="21" rx="3"/>
    <path d="M673 96 h12 M679 89 v7"/>
  </g>
  <text x="706" y="80" class="h">Every endpoint</text>
  <text x="706" y="97" class="mono">%LocalAppData%</text>
  <text x="664" y="124" class="t">Installs for the signed-in user:</text>
  <rect x="660" y="136" width="264" height="132" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <use href="#check" transform="translate(678 159)"/><text x="690" y="163" class="ok">no UAC, no admin rights</text>
  <use href="#check" transform="translate(678 189)"/><text x="690" y="193" class="ok">no service, nothing in HKLM</text>
  <use href="#check" transform="translate(678 219)"/><text x="690" y="223" class="ok">starts at logon, configured</text>
  <use href="#check" transform="translate(678 249)"/><text x="690" y="253" class="ok">updates itself</text>
  <text x="664" y="294" class="res">The user picks their admin account</text>
  <text x="664" y="311" class="res">and signs in. That's it.</text>
</svg>
