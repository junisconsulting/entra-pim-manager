<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200">
  <title>The four tray icon states: red not signed in, grey nothing active, green at least one role active, amber a role about to expire — each drawn for a light and a dark taskbar</title>
  <!-- Shield geometry and colours copied from src/Entra-PIM-Manager.App.Avalonia/Assets/tray-icon-*.svg -->
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .h { font-size: 14.5px; font-weight: 600; fill: #0F172A; }
    .t { font-size: 12.5px; fill: #475569; }
  </style>
  <defs>
    <g id="on-light">
      <path fill="#0a1630" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" d="M16 0.5 L30 4.5 L30 19 Q30 29 16 31.5 Q2 29 2 19 L2 4.5 Z"/>
      <circle fill="#ffffff" cx="16" cy="12" r="5.2"/>
      <circle fill="#0a1630" cx="16" cy="12" r="2.2"/>
      <rect fill="#ffffff" x="14.6" y="16.8" width="2.8" height="9.2" rx="1.4"/>
      <rect fill="#ffffff" x="17.4" y="20.5" width="3.2" height="2.2" rx="0.9"/>
      <rect fill="#ffffff" x="17.4" y="23.8" width="2.4" height="2" rx="0.9"/>
      <circle fill="#ffffff" cx="25.5" cy="25.5" r="5.8"/>
    </g>
    <g id="on-dark">
      <path fill="#f2f4f8" stroke="#0a1630" stroke-width="2.4" stroke-linejoin="round" d="M16 0.5 L30 4.5 L30 19 Q30 29 16 31.5 Q2 29 2 19 L2 4.5 Z"/>
      <circle fill="#0a1630" cx="16" cy="12" r="5.2"/>
      <circle fill="#f2f4f8" cx="16" cy="12" r="2.2"/>
      <rect fill="#0a1630" x="14.6" y="16.8" width="2.8" height="9.2" rx="1.4"/>
      <rect fill="#0a1630" x="17.4" y="20.5" width="3.2" height="2.2" rx="0.9"/>
      <rect fill="#0a1630" x="17.4" y="23.8" width="2.4" height="2" rx="0.9"/>
      <circle fill="#0a1630" cx="25.5" cy="25.5" r="5.8"/>
    </g>
    <g id="swatch">
      <rect x="0" y="0" width="94" height="60" rx="8" fill="#EEF1F6"/>
      <rect x="98" y="0" width="94" height="60" rx="8" fill="#202020"/>
    </g>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="199" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Red -->
  <rect x="24" y="24" width="210" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g transform="translate(33 34)">
    <use href="#swatch"/>
    <g transform="translate(26 9) scale(1.3)"><use href="#on-light"/><circle fill="#ef4444" cx="25.5" cy="25.5" r="4.2"/></g>
    <g transform="translate(124 9) scale(1.3)"><use href="#on-dark"/><circle fill="#ef4444" cx="25.5" cy="25.5" r="4.2"/></g>
  </g>
  <text x="40" y="124" class="h">Not signed in</text>
  <text x="40" y="145" class="t">No account yet, or the</text>
  <text x="40" y="162" class="t">session expired.</text>

  <!-- Grey -->
  <rect x="258" y="24" width="210" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g transform="translate(267 34)">
    <use href="#swatch"/>
    <g transform="translate(26 9) scale(1.3)"><use href="#on-light"/><circle fill="#9ca3af" cx="25.5" cy="25.5" r="4.2"/></g>
    <g transform="translate(124 9) scale(1.3)"><use href="#on-dark"/><circle fill="#9ca3af" cx="25.5" cy="25.5" r="4.2"/></g>
  </g>
  <text x="274" y="124" class="h">Nothing active</text>
  <text x="274" y="145" class="t">Signed in, no privileges.</text>
  <text x="274" y="162" class="t">The normal resting state.</text>

  <!-- Green -->
  <rect x="492" y="24" width="210" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g transform="translate(501 34)">
    <use href="#swatch"/>
    <g transform="translate(26 9) scale(1.3)"><use href="#on-light"/><circle fill="#22c55e" cx="25.5" cy="25.5" r="4.2"/></g>
    <g transform="translate(124 9) scale(1.3)"><use href="#on-dark"/><circle fill="#22c55e" cx="25.5" cy="25.5" r="4.2"/></g>
  </g>
  <text x="508" y="124" class="h">Privileged</text>
  <text x="508" y="145" class="t">At least one role is active.</text>
  <text x="508" y="162" class="t">The tooltip counts them.</text>

  <!-- Amber -->
  <rect x="726" y="24" width="210" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g transform="translate(735 34)">
    <use href="#swatch"/>
    <g transform="translate(26 9) scale(1.3)"><use href="#on-light"/><circle fill="#f59e0b" cx="25.5" cy="25.5" r="4.2"/></g>
    <g transform="translate(124 9) scale(1.3)"><use href="#on-dark"/><circle fill="#f59e0b" cx="25.5" cy="25.5" r="4.2"/></g>
  </g>
  <text x="742" y="124" class="h">Expiring soon</text>
  <text x="742" y="145" class="t">A role is about to run out.</text>
  <text x="742" y="162" class="t">The tooltip names it.</text>
</svg>
