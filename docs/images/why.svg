<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <title>Activating a role in the Entra admin center takes seven steps per tenant; with Entra PIM Manager it takes three, for every tenant in one list</title>
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 600; fill: #0F172A; }
    .s { font-size: 12.5px; fill: #64748B; }
    .step { font-size: 13px; fill: #334155; }
    .n { font-size: 11.5px; font-weight: 600; text-anchor: middle; }
  </style>
  <defs>
    <g id="shield">
      <path fill="#0a1630" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" d="M16 0.5 L30 4.5 L30 19 Q30 29 16 31.5 Q2 29 2 19 L2 4.5 Z"/>
      <circle fill="#ffffff" cx="16" cy="12" r="5.2"/>
      <circle fill="#0a1630" cx="16" cy="12" r="2.2"/>
      <rect fill="#ffffff" x="14.6" y="16.8" width="2.8" height="9.2" rx="1.4"/>
      <rect fill="#ffffff" x="17.4" y="20.5" width="3.2" height="2.2" rx="0.9"/>
      <rect fill="#ffffff" x="17.4" y="23.8" width="2.4" height="2" rx="0.9"/>
    </g>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Today: the portal -->
  <rect x="24" y="24" width="440" height="352" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linejoin="round">
    <rect x="44" y="44" width="24" height="20" rx="3"/>
    <path d="M44 50 H68"/>
  </g>
  <text x="80" y="60" class="h">In the Entra admin center</text>
  <text x="80" y="79" class="s">for each role, in each tenant</text>
  <path d="M44 96 H444" stroke="#EEF2F7"/>

  <g class="n" fill="#475569">
    <circle cx="54" cy="119" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="123">1</text>
    <circle cx="54" cy="149" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="153">2</text>
    <circle cx="54" cy="179" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="183">3</text>
    <circle cx="54" cy="209" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="213">4</text>
    <circle cx="54" cy="239" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="243">5</text>
    <circle cx="54" cy="269" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="273">6</text>
    <circle cx="54" cy="299" r="10" fill="#F1F5F9" stroke="#CBD5E1"/><text x="54" y="303">7</text>
  </g>
  <text x="74" y="123" class="step">Open the browser profile of that admin account</text>
  <text x="74" y="153" class="step">Sign in, approve MFA</text>
  <text x="74" y="183" class="step">Find Privileged Identity Management → My roles</text>
  <text x="74" y="213" class="step">Pick the tab: Entra roles, Groups or Azure resources</text>
  <text x="74" y="243" class="step">Find the role, click Activate</text>
  <text x="74" y="273" class="step">Reason, duration — for Azure, the scope — Activate</text>
  <text x="74" y="303" class="step">Next tenant: other account, other profile, start over</text>

  <rect x="40" y="324" width="408" height="36" rx="8" fill="#FEF2F2"/>
  <text x="56" y="347" font-size="13" font-weight="600" fill="#B91C1C">Friction like this is why admins ask for permanent roles.</text>

  <!-- With the app -->
  <rect x="496" y="24" width="440" height="352" rx="12" fill="#FFFFFF" stroke="#DDD6FE"/>
  <g transform="translate(516 42) scale(0.75)"><use href="#shield"/></g>
  <text x="552" y="60" class="h">With Entra PIM Manager</text>
  <text x="552" y="79" class="s">every tenant in one list</text>
  <path d="M516 96 H916" stroke="#EEF2F7"/>

  <g class="n" fill="#FFFFFF">
    <circle cx="526" cy="119" r="10" fill="#7C3AED"/><text x="526" y="123">1</text>
    <circle cx="526" cy="149" r="10" fill="#7C3AED"/><text x="526" y="153">2</text>
    <circle cx="526" cy="179" r="10" fill="#7C3AED"/><text x="526" y="183">3</text>
  </g>
  <text x="546" y="123" class="step">Click the shield next to the clock</text>
  <text x="546" y="153" class="step">Click the role — pinned ones sit at the top</text>
  <text x="546" y="183" class="step">Pick a saved justification, Activate</text>

  <!-- The result: one ACTIVE row as the panel shows it -->
  <rect x="516" y="206" width="400" height="92" rx="8" fill="#F7F7F7" stroke="#E4E4E7"/>
  <text x="530" y="226" font-size="10.5" font-weight="600" fill="#767676" letter-spacing=".5">ACTIVE</text>
  <text x="530" y="250" font-size="13" font-weight="600" fill="#1A1A1A">Exchange Administrator</text>
  <text x="530" y="267" font-size="11" fill="#555555">Contoso · Directory role</text>
  <text x="902" y="251" font-size="12" font-weight="600" fill="#15803D" text-anchor="end">4 h 00 min</text>
  <rect x="530" y="280" width="372" height="4" rx="2" fill="#22C55E"/>

  <rect x="512" y="324" width="408" height="36" rx="8" fill="#F0FDF4"/>
  <text x="528" y="347" font-size="13" font-weight="600" fill="#15803D">Least privilege that takes seconds is the one people use.</text>
</svg>
