name: Release

# Publishing a release is a deliberate act: push a version tag and this builds
# the Velopack package, signs it and creates the GitHub release from it.
#
#   git tag v0.4.1 && git push origin v0.4.1
#
# Run by hand on main (Actions → Release → Run workflow), it is a dry run: it builds,
# signs and verifies like a release and publishes nothing. "keep_setup" keeps the signed
# Setup.exe for one day to test it by hand; delete the artifact once downloaded.
#
# The release body is packaging/release-notes/{version}.md — the same file the
# installer and the in-app update prompt show, so all three can never drift.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      keep_setup:
        description: Keep the signed Setup.exe for one day (version 0.0.0-dryrun.N, for a sandbox)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # OIDC sign-in of the signing identity, docs/adr/0003-code-signing.md

jobs:
  release:
    runs-on: windows-latest

    # Holds the signing identity's ids and admits only v* tags and main. Every step in
    # this job can request the OIDC token that signs as junis GmbH, so its actions are
    # pinned by commit.
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Derive version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              # Never published; the suffix keeps it apart from every real version.
              $version = '0.0.0-dryrun.${{ github.run_number }}'
          }
          else {
              $version = '${{ github.ref_name }}'.TrimStart('v')
              if ($version -notmatch '^\d+\.\d+\.\d+$') {
                  throw "Tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH."
              }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Require release notes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          # Fail before building rather than shipping a release with an empty body.
          $notes = "packaging/release-notes/${{ steps.version.outputs.version }}.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }

      - name: Build and test
        run: |
          dotnet build -c Release -warnaserror
          dotnet test -c Release --no-build

      - name: Fetch previous releases
        if: github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          # Velopack needs the existing feed on disk to generate a delta package
          # (a few hundred KB instead of a ~65 MB full download). Missing on the
          # first-ever release, hence continue-on-error. The token is not for access
          # (the repo is public) but for the rate limit: anonymous API calls share a
          # per-IP quota with every other job on the runner, and v0.13.0 lost its
          # delta to a 403.
          $project = 'src/Entra-PIM-Manager.App.Avalonia/Entra-PIM-Manager.App.Avalonia.csproj'
          $velopack = ([xml](Get-Content $project)).Project.ItemGroup.PackageReference |
              Where-Object { $_.Include -eq 'Velopack' } |
              Select-Object -First 1 -ExpandProperty Version
          dotnet tool install --global vpk --version $velopack
          vpk download github `
              --repoUrl '${{ github.server_url }}/${{ github.repository }}' `
              --token '${{ github.token }}' `
              --channel win `
              --outputDir packaging/velopack/releases

      - name: Sign in to Azure as the signing identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Pack with Velopack (signed)
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          # GitHub's OIDC assertion expires after five minutes, before build.ps1's publish is
          # done; fetching the signing token now leaves it in the Azure CLI's cache.
          az account get-access-token --scope https://codesigning.azure.net/.default --output none
          if ($LASTEXITCODE -ne 0) { throw 'No token for Artifact Signing.' }

          # The signing library walks a chain of credentials; only the Azure CLI session from
          # the sign-in above is meant to sign. The names are case-sensitive.
          $metadata = Join-Path $env:RUNNER_TEMP 'artifact-signing.json'
          @{
              Endpoint               = $env:SIGNING_ENDPOINT
              CodeSigningAccountName = $env:SIGNING_ACCOUNT
              CertificateProfileName = $env:SIGNING_PROFILE
              ExcludeCredentials     = @(
                  'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
                  'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
                  'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content $metadata -Encoding utf8

          ./packaging/velopack/build.ps1 -Version ${{ steps.version.outputs.version }} -AzureTrustedSignFile $metadata

      - name: Verify signatures
        shell: pwsh
        run: |
          # The gate: vpk can produce unsigned output without failing. Every PE file must be
          # validly signed; ours (Setup.exe, Update.exe, the stub, the app) by junis GmbH and
          # timestamped, so the signature outlives the 72-hour certificate.
          $releases = 'packaging/velopack/releases'
          $tree = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive "$releases/Entra-PIM-Manager-win-Portable.zip" $tree -Force
          $setup = Get-Item "$releases/Entra-PIM-Manager-win-Setup.exe"

          $files = @($setup) + @(Get-ChildItem $tree -Recurse -File -Include *.exe, *.dll)
          $invalid = @($files | Get-AuthenticodeSignature | Where-Object Status -ne 'Valid')
          if ($invalid) {
              $invalid | Format-Table Path, Status -AutoSize | Out-String -Width 300 | Write-Host
              throw "$($invalid.Count) of $($files.Count) files are unsigned or invalid."
          }

          $ours = @($setup) + @(Get-ChildItem $tree -Recurse -File |
              Where-Object Name -in 'Update.exe', 'Entra PIM Manager.exe', 'Entra-PIM-Manager.exe')
          if ($ours.Count -ne 4) { throw "Expected Setup.exe, Update.exe, the stub and the app; found $($ours.Name -join ', ')." }
          foreach ($signature in $ours | Get-AuthenticodeSignature) {
              if ($signature.SignerCertificate.Subject -notmatch '\bO=junis GmbH\b' -or -not $signature.TimeStamperCertificate) {
                  throw "$($signature.Path) is not signed by junis GmbH with a timestamp: $($signature.SignerCertificate.Subject)"
              }
          }
          Write-Host "$($files.Count) files validly signed; ours by $(($ours[0] | Get-AuthenticodeSignature).SignerCertificate.Subject)"

      # Off by default: anyone signed in to GitHub can download an artifact of this public repo.
      - name: Keep the signed Setup.exe (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.keep_setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-setup-dryrun
          path: packaging/velopack/releases/Entra-PIM-Manager-win-Setup.exe
          retention-days: 1

      - name: Pack for Intune
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          # The same Setup.exe plus the endpoint scripts, as a Win32 app admins upload into
          # their own tenant. Tenant-neutral; see docs/adr/0001-intune-win32-package.md.
          ./packaging/intune/build.ps1 `
              -SetupExe packaging/velopack/releases/Entra-PIM-Manager-win-Setup.exe `
              -OutputDir packaging/velopack/releases

      - name: Create GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $releases = 'packaging/velopack/releases'

          # The update feed matters as much as the installer: GithubSource reads
          # releases.win.json / RELEASES, so an installed client that only finds
          # the .exe attached will never see the update. Named explicitly rather
          # than globbing the folder, which also holds the previous version's
          # full package pulled in for the delta.
          $assets = @(
              "$releases/releases.win.json"
              "$releases/RELEASES"
              "$releases/Entra-PIM-Manager-win-Setup.exe"
              "$releases/Entra-PIM-Manager-win-Portable.zip"
              "$releases/Entra-PIM-Manager-win-Setup.intunewin"
              "$releases/Entra-PIM-Manager-$version-full.nupkg"
          )
          $delta = "$releases/Entra-PIM-Manager-$version-delta.nupkg"
          if (Test-Path $delta) { $assets += $delta }

          $missing = $assets | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Expected release assets are missing:`n$($missing -join "`n")" }

          gh release create '${{ github.ref_name }}' `
              --title '${{ github.ref_name }}' `
              --notes-file "packaging/release-notes/$version.md" `
              --verify-tag `
              $assets
